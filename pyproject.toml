[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykvfs"
version = "0.2.1"
description = "Python implementation of kvfs: Key-Value backed networked shared filesystem using redis/valkey server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Muayyad Alsadi" }
]

dependencies = [
  "pyfuse3",
  "redis[hiredis]>=5.0",
]

optional-dependencies.test = [
  "pytest",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Filesystems"
]

[project.scripts]
kvfs = "kvfs.cli:main"

[tool.setuptools.packages.find]
include = ["kvfs*"]

[project.urls]
Homepage = "https://github.com/muayyad-alsadi/pykvfs"
Repository = "https://github.com/muayyad-alsadi/pykvfs"
"Go implementation" = "https://github.com/muayyad-alsadi/kvfs"
